version: 2

models:
  - name: int_identity_map
    description: FR-02 Stripe customer -> CRM contact via CRM id, hashed email, then company domain.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: match_method
        data_tests:
          - accepted_values:
              arguments:
                values: [crm_id, email, domain]

  - name: int_customers
    description: Paying customers with acquisition date, cohort, segment and stitched account.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: acquired_at
        data_tests: [not_null]
      - name: match_method
        data_tests:
          - accepted_values:
              arguments:
                values: [crm_id, email, domain, unmatched]

  - name: int_journey_touchpoints
    description: Touchpoints on each customer's path within the attribution lookback window.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_id, touchpoint_key]

  - name: fct_attribution
    description: FR-05 credit per customer, attribution model, channel and campaign.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_id, attribution_model, channel, campaign]
    columns:
      - name: attribution_model
        data_tests:
          - relationships:
              arguments:
                to: ref('attribution_models')
                field: attribution_model
      - name: credit
        data_tests:
          - non_negative
          - sums_to:
              arguments:
                group_by: [customer_id, attribution_model]
                expected: 1

  - name: int_leads
    description: Leads attributed to the touch that created them.
    columns:
      - name: contact_key
        data_tests: [unique, not_null]

  - name: int_opportunities
    columns:
      - name: deal_key
        data_tests: [unique, not_null]

version: 2

models:
  - name: int_invoice_months
    description: Invoice revenue recognised evenly across its service months.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [invoice_id, revenue_month]

  - name: int_customer_months
    description: FR-04 customer x month grid with net revenue (after refunds/chargebacks) and activity.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_id, revenue_month]
    columns:
      - name: months_since_acquisition
        data_tests: [not_null, non_negative]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python, dbt and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy api pipelines
      - name: Tests (builds the demo warehouse with dbt end to end)
        run: uv run pytest
      - name: Evals on the demo data (Q&A planner, alert lead time)
        run: |
          uv run caclens refresh --demo
          uv run caclens eval
          uv run caclens alerts-backtest --strict

  web:
    name: Web lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

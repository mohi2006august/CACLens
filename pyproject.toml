[project]
name = "caclens"
version = "0.1.0"
description = "Channel-level CAC, LTV:CAC and payback analytics with plain-English Q&A."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anthropic>=0.40",
  "dagster>=1.9",
  "dagster-dbt>=0.25",
  "dagster-webserver>=1.9",
  "dbt-core>=1.9",
  "dbt-duckdb>=1.9",
  "dlt[duckdb]>=1.4",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "requests>=2.32",
  "structlog>=24.4",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
caclens = "pipelines.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.3",
  "responses>=0.25",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
  "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines", "api"]

[tool.dagster]
module_name = "pipelines.definitions"
code_location_name = "caclens"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.uv]
# The repo often lives in synced folders (OneDrive/Dropbox) where hardlinks fail.
link-mode = "copy"
